spring.application.name=learnSpringboot
#配置当前应用服务端口 默认8080
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/CloudDriveLite?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=331307
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# 文件上传配置
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true

# 日志降噪：业务包为info，默认warn
logging.level.root=warn
logging.level.com.peng.clouddrivelite=info
logging.level.org.springframework.web=warn

# Session Cookie 配置
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

